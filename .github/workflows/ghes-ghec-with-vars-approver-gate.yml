name: ghes-ghec-with-vars-approver-gate

on:
  workflow_dispatch:
    inputs:
      migration_path:
        description: "Select the migration path"
        required: true
        default: "ghes-to-ghec"
        type: choice
        options:
          - ghes-to-ghec
          - ghec-to-ghec-emu

      runner:
        description: >
          Runner selector. Use ubuntu-latest for GitHub-hosted. For self-hosted,
          provide a JSON array, for example ["self-hosted","linux","x64","migration"].
        required: true
        default: "ubuntu-latest"
        type: string

      csv_path:
        description: "Path to repos.csv for the GHES-to-GHEC path"
        required: true
        default: "repos.csv"
        type: string

      max_concurrent:
        description: "Maximum concurrent repository migrations (1-5)"
        required: false
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]

      run_pre_validation:
        description: "GHES path - run Stage 1 pre-migration validation"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      run_migration:
        description: "GHES path - run Stage 2 repository migration"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      run_post_validation:
        description: "GHES path - run Stage 3 post-migration validation"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      run_vars_migration:
        description: "GHES path - run Stage 4 org/repo/environment variables migration"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      run_emu_org_migration:
        description: "EMU path - run GHEC-to-GHEC EMU organization migration"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

      ghec_source_org:
        description: "EMU path - source GHEC organization"
        required: false
        default: ""
        type: string

      emu_target_org:
        description: "EMU path - NEW target organization"
        required: false
        default: ""
        type: string

      emu_target_enterprise:
        description: "EMU path - destination EMU enterprise slug"
        required: false
        default: ""
        type: string

      emu_target_api_url:
        description: "EMU path - base API URL for GHE.com only; leave blank for github.com"
        required: false
        default: ""
        type: string

      
permissions:
  contents: read
  actions: write

env:
  GH_PAT: ${{ secrets.GH_PAT }}
  GH_SOURCE_PAT: ${{ secrets.GH_SOURCE_PAT }}
  GHES_API_URL: ${{ secrets.GHES_API_URL }}
  GH_TARGET_HOST: ${{ secrets.GH_TARGET_HOST }}

jobs:
  pre-migration-validation:
    name: Stage 1 - Pre-migration validation
    if: ${{ inputs.migration_path == 'ghes-to-ghec' && inputs.run_pre_validation == 'true' }}
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJson(inputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites (GitHub-hosted only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gh python3 curl
          gh --version
          jq --version
          python3 --version

      - name: Validate GH_PAT and GH_SOURCE_PAT
        id: validate_pats
        shell: bash
        run: |
          set -uo pipefail
          : "${GH_PAT:?GH_PAT secret is required}"
          : "${GH_SOURCE_PAT:?GH_SOURCE_PAT secret is required}"
          : "${GHES_API_URL:?GHES_API_URL secret is required}"

          GHEC_OK=false
          GHES_OK=false
          GHEC_USER="N/A"
          GHES_USER="N/A"

          GHEC_STATUS=$(curl -sS -o /tmp/ghec_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user")

          if [[ "$GHEC_STATUS" == "200" ]]; then
            GHEC_USER=$(jq -r '.login // "unknown"' /tmp/ghec_resp.json)
            GHEC_OK=true
            echo "GHEC PAT valid for ${GHEC_USER}"
          else
            echo "::error::GH_PAT validation failed with HTTP ${GHEC_STATUS}"
            jq -r '.message // "Unknown API error"' /tmp/ghec_resp.json || true
          fi

          GHES_BASE="${GHES_API_URL%/}"
          GHES_STATUS=$(curl -skS -o /tmp/ghes_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_SOURCE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "${GHES_BASE}/user")

          if [[ "$GHES_STATUS" == "200" ]]; then
            GHES_USER=$(jq -r '.login // "unknown"' /tmp/ghes_resp.json)
            GHES_OK=true
            echo "GHES PAT valid for ${GHES_USER}"
          else
            echo "::error::GH_SOURCE_PAT validation failed with HTTP ${GHES_STATUS}"
            jq -r '.message // "Unknown API error"' /tmp/ghes_resp.json || true
          fi

          echo "gh_pat_valid=${GHEC_OK}" >> "$GITHUB_OUTPUT"
          echo "gh_source_pat_valid=${GHES_OK}" >> "$GITHUB_OUTPUT"
          echo "gh_pat_user=${GHEC_USER}" >> "$GITHUB_OUTPUT"
          echo "gh_source_pat_user=${GHES_USER}" >> "$GITHUB_OUTPUT"

          [[ "$GHEC_OK" == "true" && "$GHES_OK" == "true" ]] || exit 1

      - name: Install or update GEI extension
        shell: bash
        run: |
          set -euo pipefail
          if gh extension list | awk '{print $1}' | grep -qx 'github/gh-gei'; then
            gh extension upgrade github/gh-gei
          else
            gh extension install github/gh-gei
          fi
          gh gei --help >/dev/null

      - name: Make scripts executable
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Prepare CSV for scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ inputs.csv_path }}"
          cp "${{ inputs.csv_path }}" scripts/repos.csv

      - name: Run pre-migration checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/1_migration-readiness.sh 2>&1 | tee precheck.log

      - name: Publish pre-validation summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Pre-Migration Validation Summary"
            echo
            echo "**CSV:** \`${{ inputs.csv_path }}\`"
            echo
            if [[ -f precheck.log ]]; then
              grep -E "Total Repositories Processed:|Repositories with Active Pull Requests:|Repositories with Workflows \(Running or Queued\):|Repositories with Open Issues:" precheck.log | sed 's/^/- /' || true
            else
              echo "> [!CAUTION]"
              echo "> precheck.log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload precheck artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stage1-precheck-${{ github.run_id }}
          path: |
            precheck.log
            scripts/repos.csv
          if-no-files-found: warn

  migration:
    name: Stage 2 - Migration (GHES to GHEC)
    environment: migration-approval
    needs: [pre-migration-validation]
    if: >-
      ${{ always() &&
          inputs.migration_path == 'ghes-to-ghec' &&
          inputs.run_migration == 'true' &&
          (needs.pre-migration-validation.result == 'success' ||
           needs.pre-migration-validation.result == 'skipped') }}
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJson(inputs.runner) }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites (GitHub-hosted only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gh python3 curl

      - name: Install or update GEI extension
        shell: bash
        run: |
          set -euo pipefail
          if gh extension list | awk '{print $1}' | grep -qx 'github/gh-gei'; then
            gh extension upgrade github/gh-gei
          else
            gh extension install github/gh-gei
          fi
          gh gei --help >/dev/null

      - name: Make scripts executable and prepare CSV
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -f "${{ inputs.csv_path }}"
          cp "${{ inputs.csv_path }}" scripts/repos.csv

      - name: Run migration in parallel
        shell: bash
        run: |
          set -euo pipefail
          export GH_TARGET_HOST
          ./scripts/2_migration.sh \
            --max-concurrent "${{ inputs.max_concurrent }}" \
            --csv scripts/repos.csv \
            --output repo_migration_output.csv \
            2>&1 | tee migration.log

      - name: Capture Octoshift logs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p octoshift-logs
          cp -v ./*.octoshift*.log octoshift-logs/ 2>/dev/null || true
          cp -v migration.log repo_migration_output.csv octoshift-logs/ 2>/dev/null || true
          cp -v migration-*.txt octoshift-logs/ 2>/dev/null || true
          tar -czf octoshift-logs.tgz octoshift-logs

      - name: Publish migration summary
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("repo_migration_output.csv")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Migration Summary (GHES to GHEC)", "", f"- **Concurrency:** `${{ inputs.max_concurrent }}`", ""]
          if not out.exists():
              lines += ["> [!CAUTION]", "> `repo_migration_output.csv` was not created. Check `migration.log`."]
          else:
              rows = list(csv.DictReader(out.open(encoding="utf-8", newline="")))
              ok = sum((r.get("Migration_Status") or "").lower().startswith("success") for r in rows)
              failed = len(rows) - ok
              lines += [f"- Success: **{ok}**", f"- Not successful: **{failed}**", "", "| Source | Status | Target |", "|---|---|---|"]
              for r in rows:
                  src = f"{r.get('ghes_org','')}/{r.get('ghes_repo','')}"
                  dst = f"{r.get('github_org','')}/{r.get('github_repo','')}"
                  status = r.get("Migration_Status") or "Unknown"
                  lines.append(f"| `{src}` | {status} | `{dst}` |")
          summary.write_text(summary.read_text(encoding="utf-8") + "\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload migration artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stage2-migration-${{ github.run_id }}
          path: |
            migration.log
            repo_migration_output.csv
            migration-*.txt
            octoshift-logs.tgz
          if-no-files-found: warn

  post-migration-validation:
    name: Stage 3 - Post-migration validation
    needs: [migration]
    if: >-
      ${{ always() &&
          inputs.migration_path == 'ghes-to-ghec' &&
          inputs.run_post_validation == 'true' &&
          needs.migration.result == 'success' }}
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJson(inputs.runner) }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites (GitHub-hosted only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gh python3

      - name: Prepare scripts and CSV
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -f "${{ inputs.csv_path }}"
          cp "${{ inputs.csv_path }}" scripts/repos.csv

      - name: Authenticate and run post-migration validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GH_TARGET_HOST:-}" ]]; then
            printf '%s' "$GH_PAT" | gh auth login --hostname "$GH_TARGET_HOST" --with-token
          else
            printf '%s' "$GH_PAT" | gh auth login --hostname github.com --with-token
          fi
          export GH_TARGET_HOST
          ./scripts/3_post_migration_validation.sh 2>&1 | tee post_validation.log

      - name: Publish post-validation summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Post-Migration Validation Summary"
            echo
            if [[ -f post_validation.log ]]; then
              grep -E "Validating migration:|Branch Count:|GHES Commits=|GHES SHA=" post_validation.log | sed 's/^/- /' || true
            else
              echo "> [!CAUTION]"
              echo "> post_validation.log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload post-validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stage3-postvalidation-${{ github.run_id }}
          path: |
            post_validation.log
            validation-log-*.txt
            validation-*.json
          if-no-files-found: warn

  vars-migration:
    name: Stage 4 - Variables migration (GHES to GHEC)
    environment: migration-approval
    needs: [post-migration-validation]
    if: >-
      ${{ always() &&
          inputs.migration_path == 'ghes-to-ghec' &&
          inputs.run_vars_migration == 'true' &&
          needs.post-migration-validation.result == 'success' }}
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJson(inputs.runner) }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites (GitHub-hosted only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Prepare scripts and CSV
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -f "${{ inputs.csv_path }}"
          cp "${{ inputs.csv_path }}" scripts/repos.csv

      - name: Authenticate GitHub CLI to GHES
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HOST="${GHES_API_URL#*://}"
          SOURCE_HOST="${SOURCE_HOST%%/*}"
          printf '%s' "$GH_SOURCE_PAT" | gh auth login --hostname "$SOURCE_HOST" --with-token
          gh auth status --hostname "$SOURCE_HOST"

      - name: Run variables migration script
        shell: bash
        run: |
          set -euo pipefail
          export CSV_FILE="scripts/repos.csv"
          export GH_TARGET_HOST
          ./scripts/4_ghes_ghec_var_mig.sh 2>&1 | tee vars_migration.log

      - name: Publish variables migration summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Variables Migration Summary"
            echo
            grep -E "Processing:|Syncing Org Vars|Syncing Repo Vars|rules synced|Env Var:|Migration Complete|Error:|401|403|404" vars_migration.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload variables migration artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stage4-vars-migration-${{ github.run_id }}
          path: |
            vars_migration.log
            scripts/repos.csv
          if-no-files-found: warn

  ghec-to-ghec-emu-org-migration:
    name: GHEC to GHEC EMU - Organization migration
    environment: emu-migration-approval
    if: ${{ inputs.migration_path == 'ghec-to-ghec-emu' && inputs.run_emu_org_migration == 'true' }}
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJson(inputs.runner) }}
    timeout-minutes: 720
    env:
      GH_SOURCE_PAT: ${{ secrets.GHEC_EMU_SOURCE_PAT }}
      GH_PAT: ${{ secrets.GHEC_EMU_TARGET_PAT }}
    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh jq curl

      - name: Show and validate required inputs and secrets
        shell: bash
        env:
          MIGRATION_PATH: ${{ inputs.migration_path }}
          SELECTED_RUNNER: ${{ inputs.runner }}
          SOURCE_ORG: ${{ inputs.ghec_source_org }}
          TARGET_ORG: ${{ inputs.emu_target_org }}
          TARGET_ENTERPRISE: ${{ inputs.emu_target_enterprise }}
          TARGET_API_URL: ${{ inputs.emu_target_api_url }}
        
        run: |
          set -euo pipefail
          EFFECTIVE_TARGET_API_URL="${TARGET_API_URL:-https://api.github.com}"
          EFFECTIVE_TARGET_API_URL="${EFFECTIVE_TARGET_API_URL%/}"

          echo "=================================================="
          echo "GHEC -> GHEC EMU Migration Inputs"
          echo "=================================================="
          echo "Migration Path     : ${MIGRATION_PATH}"
          echo "Runner             : ${SELECTED_RUNNER}"
          echo "Source Org         : ${SOURCE_ORG}"
          echo "Target Org         : ${TARGET_ORG}"
          echo "Target Enterprise  : ${TARGET_ENTERPRISE}"
          echo "Target API URL     : ${EFFECTIVE_TARGET_API_URL}"
          echo "=================================================="

          {
            echo "## GHEC -> GHEC EMU Organization Migration"
            echo
            echo "### Migration inputs"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Migration Path | \`${MIGRATION_PATH}\` |"
            echo "| Runner | \`${SELECTED_RUNNER}\` |"
            echo "| Source Organization | \`${SOURCE_ORG}\` |"
            echo "| Target Organization | \`${TARGET_ORG}\` |"
            echo "| Target Enterprise | \`${TARGET_ENTERPRISE}\` |"
            echo "| Target API URL | \`${EFFECTIVE_TARGET_API_URL}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          failed=false
          [[ -n "$SOURCE_ORG" ]] || { echo "::error::ghec_source_org is required."; failed=true; }
          [[ -n "$TARGET_ORG" ]] || { echo "::error::emu_target_org is required."; failed=true; }
          [[ -n "$TARGET_ENTERPRISE" ]] || { echo "::error::emu_target_enterprise is required."; failed=true; }
          [[ -n "${GH_SOURCE_PAT:-}" ]] || { echo "::error::GHEC_EMU_SOURCE_PAT secret is required."; failed=true; }
          [[ -n "${GH_PAT:-}" ]] || { echo "::error::GHEC_EMU_TARGET_PAT secret is required."; failed=true; }
          if [[ -n "$SOURCE_ORG" && -n "$TARGET_ORG" && "$SOURCE_ORG" == "$TARGET_ORG" ]]; then
            echo "::error::Source and target organization names must be different."
            failed=true
          fi
          if [[ -n "$TARGET_API_URL" && ! "$TARGET_API_URL" =~ ^https://api\.[A-Za-z0-9.-]+\.ghe\.com/?$ ]]; then
            echo "::error::emu_target_api_url must be a GHE.com base API URL, for example https://api.example.ghe.com"
            failed=true
          fi
          [[ "$failed" == false ]] || exit 1
          echo "Input and secret validation successful."

      - name: Validate source and target PATs
        id: validate_emu_pats
        shell: bash
        env:
          TARGET_API_URL: ${{ inputs.emu_target_api_url }}
        run: |
          set -uo pipefail

          TARGET_API="${TARGET_API_URL:-https://api.github.com}"
          TARGET_API="${TARGET_API%/}"

          SOURCE_STATUS="FAILED"
          TARGET_STATUS="FAILED"

          SOURCE_USER="N/A"
          TARGET_USER="N/A"

          SOURCE_HTTP="Unknown"
          TARGET_HTTP="Unknown"

          echo "=================================================="
          echo "Validating SOURCE PAT"
          echo "=================================================="

          SOURCE_HTTP=$(curl -sS \
            -o /tmp/source.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_SOURCE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user")

          if [[ "${SOURCE_HTTP}" == "200" ]]; then
            SOURCE_STATUS="SUCCESS"
            SOURCE_USER=$(jq -r '.login // "unknown"' /tmp/source.json)
            echo "✅ Source PAT Valid"
            echo "Authenticated User: ${SOURCE_USER}"
          else
            echo "❌ Source PAT Invalid"
            echo "HTTP Status: ${SOURCE_HTTP}"
          fi

          echo ""
          echo "=================================================="
          echo "Validating TARGET PAT"
          echo "=================================================="

          TARGET_HTTP=$(curl -sS \
            -o /tmp/target.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${TARGET_API}/user")

          if [[ "${TARGET_HTTP}" == "200" ]]; then
            TARGET_STATUS="SUCCESS"
            TARGET_USER=$(jq -r '.login // "unknown"' /tmp/target.json)
            echo "✅ Target PAT Valid"
            echo "Authenticated User: ${TARGET_USER}"
          else
            echo "❌ Target PAT Invalid"
            echo "HTTP Status: ${TARGET_HTTP}"
          fi

          echo "source_user=${SOURCE_USER}" >> "$GITHUB_OUTPUT"
          echo "target_user=${TARGET_USER}" >> "$GITHUB_OUTPUT"

          echo "source_pat_status=${SOURCE_STATUS}" >> "$GITHUB_OUTPUT"
          echo "target_pat_status=${TARGET_STATUS}" >> "$GITHUB_OUTPUT"

          {
            echo "## 🔑 PAT Validation Summary"
            echo ""
            echo "### Authentication Results"
            echo ""
            echo "| Token | Status | User | HTTP Code |"
            echo "|--------|--------|--------|--------|"
            echo "| Source PAT | $([[ \"$SOURCE_STATUS\" == \"SUCCESS\" ]] && echo '✅ Success' || echo '❌ Failed') | \`${SOURCE_USER}\` | \`${SOURCE_HTTP}\` |"
            echo "| Target PAT | $([[ \"$TARGET_STATUS\" == \"SUCCESS\" ]] && echo '✅ Success' || echo '❌ Failed') | \`${TARGET_USER}\` | \`${TARGET_HTTP}\` |"
            echo ""
            echo "### Migration Identities"
            echo ""
            echo "- Source Authenticated User: \`${SOURCE_USER}\`"
            echo "- Target Authenticated User: \`${TARGET_USER}\`"
            echo "- Target API Endpoint: \`${TARGET_API}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${SOURCE_STATUS}" != "SUCCESS" || "${TARGET_STATUS}" != "SUCCESS" ]]; then
            echo ""
            echo "❌ One or more PAT validations failed."
            exit 1
          fi

          echo ""
          echo "✅ Source and Target PAT validation successful."

      - name: Install or update GEI
        shell: bash
        run: |
          set -euo pipefail
          if gh extension list | awk '{print $1}' | grep -qx github/gh-gei; then gh extension upgrade github/gh-gei; else gh extension install github/gh-gei; fi
          gh gei migrate-org --help

      - name: Verify target organization is unused
        shell: bash
        env:
          TARGET_ORG: ${{ inputs.emu_target_org }}
          TARGET_API_URL: ${{ inputs.emu_target_api_url }}
        run: |
          set -euo pipefail
          TARGET_API="${TARGET_API_URL:-https://api.github.com}"; TARGET_API="${TARGET_API%/}"
          status=$(curl -sS -o /tmp/org.json -w '%{http_code}' -H "Authorization: Bearer $GH_PAT" -H 'Accept: application/vnd.github+json' "$TARGET_API/orgs/$TARGET_ORG")
          case "$status" in
            404) echo "Target organization name is available: $TARGET_ORG" ;;
            200) echo "::error::Target organization '$TARGET_ORG' already exists."; exit 1 ;;
            *) jq -r '.message // "Unknown API error"' /tmp/org.json; exit 1 ;;
          esac

      - name: Run organization migration
        id: emu_org_migration
        shell: bash
        env:
          SOURCE_ORG: ${{ inputs.ghec_source_org }}
          TARGET_ORG: ${{ inputs.emu_target_org }}
          TARGET_ENTERPRISE: ${{ inputs.emu_target_enterprise }}
          TARGET_API_URL: ${{ inputs.emu_target_api_url }}
        run: |
          set -uo pipefail
          args=(gh gei migrate-org --github-source-org "$SOURCE_ORG" --github-target-org "$TARGET_ORG" --github-target-enterprise "$TARGET_ENTERPRISE")
          [[ -z "$TARGET_API_URL" ]] || args+=(--target-api-url "${TARGET_API_URL%/}")
          set +e
          "${args[@]}" 2>&1 | tee emu_org_migration.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish EMU migration summary
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_ORG: ${{ inputs.ghec_source_org }}
          TARGET_ORG: ${{ inputs.emu_target_org }}
          TARGET_ENTERPRISE: ${{ inputs.emu_target_enterprise }}
          EXIT_CODE: ${{ steps.emu_org_migration.outputs.exit_code }}
          TARGET_API_URL: ${{ inputs.emu_target_api_url }}
        run: |
          set +e
      
          TARGET_API="${TARGET_API_URL:-https://api.github.com}"
          TARGET_API="${TARGET_API%/}"
      
          {
            echo "## 🚀 EMU Organization Migration Result"
            echo ""
            echo "| Parameter | Value |"
            echo "|------------|------------|"
            echo "| Source Organization | \`${SOURCE_ORG}\` |"
            echo "| Target Organization | \`${TARGET_ORG}\` |"
            echo "| Target Enterprise | \`${TARGET_ENTERPRISE}\` |"
            echo "| Exit Code | \`${EXIT_CODE:-not-available}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      
          #
          # Only attempt repo inventory when migration succeeded
          #
          if [[ "${EXIT_CODE}" == "0" ]]; then

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Repositories in Target Organization" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          
            TARGET_API="${TARGET_API_URL:-https://api.github.com}"
            TARGET_API="${TARGET_API%/}"
          
            if [[ "$TARGET_API" == "https://api.github.com" ]]; then
              TARGET_HOST="github.com"
            else
              TARGET_HOST="${TARGET_API#https://api.}"
              TARGET_HOST="${TARGET_HOST%%/*}"
            fi
          
            echo "Collecting repositories from ${TARGET_ORG}..."
          
            gh api \
              --hostname "$TARGET_HOST" \
              --paginate \
              "/orgs/${TARGET_ORG}/repos?per_page=100&type=all" \
              --jq '.[]' | jq -s '.' > repos.json
          
            REPO_COUNT=$(jq '. | length' repos.json)
          
            echo "- Total Repositories: **${REPO_COUNT}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          
            if [[ "$REPO_COUNT" -gt 0 ]]; then
          
              echo "| Repository | Visibility | Default Branch |" >> "$GITHUB_STEP_SUMMARY"
              echo "|------------|------------|----------------|" >> "$GITHUB_STEP_SUMMARY"
          
              jq -r '
                .[] |
                "| \(.name) | \(.visibility) | \(.default_branch) |"
              ' repos.json >> "$GITHUB_STEP_SUMMARY"
          
              jq -r '
                .[] |
                [
                  .name,
                  .visibility,
                  .default_branch,
                  .html_url
                ] | @csv
              ' repos.json > migrated_repositories.csv
          
            else
          
              echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
              echo "> No repositories were returned from ${TARGET_ORG}." >> "$GITHUB_STEP_SUMMARY"
          
              echo "repository,visibility,default_branch,html_url" > migrated_repositories.csv
          
            fi
          
          else
          
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> [!CAUTION]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Repository inventory skipped because migration was not successful." >> "$GITHUB_STEP_SUMMARY"
          
          fi          
          
      - name: Capture and upload EMU artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p emu-org-logs
          cp -v emu_org_migration.log ./*.octoshift*.log emu-org-logs/ 2>/dev/null || true
          tar -czf emu-org-migration-artifacts.tgz emu-org-logs
          
      - name: Upload EMU migration artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ghec-to-ghec-emu-org-${{ github.run_id }}
          path: |
            emu_org_migration.log
            emu-org-migration-artifacts.tgz
            *.octoshift*.log
          if-no-files-found: warn
          
      - name: Upload migrated repository inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: migrated-repositories-${{ github.run_id }}
          path: |
            migrated_repositories.csv
            repos.json
          if-no-files-found: warn
